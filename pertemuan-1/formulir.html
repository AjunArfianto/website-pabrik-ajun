<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulir Pendaftaran</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    .card {
      border-radius: 1.5rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      background: linear-gradient(90deg, #0d6efd, #6f42c1);
      color: white;
      text-align: center;
      padding: 1.5rem;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .form-control, .form-select {
      border-radius: 0.6rem;
      box-shadow: none;
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus, .form-select:focus {
      border-color: #6610f2;
      box-shadow: 0 0 0 0.2rem rgba(102, 16, 242, 0.25);
    }

    .btn-primary {
      background: linear-gradient(90deg, #0d6efd, #6610f2);
      border: none;
      border-radius: 0.6rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, #6610f2, #0d6efd);
      transform: scale(1.03);
    }

    .btn-secondary {
      border-radius: 0.6rem;
    }

    footer {
      text-align: center;
      color: #f8f9fa;
      margin-top: 1rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card bg-light">
          <div class="card-header">
            📝 Formulir Pendaftaran
          </div>
          <div class="card-body p-4">

            <form>
              <!-- Nama Lengkap -->
              <div class="mb-3">
                <label for="namaLengkap" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="namaLengkap" placeholder="Masukkan nama lengkap Anda" required>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email">
              </div>

              <!-- Nomor Telepon -->
              <div class="mb-3">
                <label for="telepon" class="form-label">Nomor Telepon</label>
                <input type="tel" class="form-control" id="telepon">
              </div>

              <!-- Jenis Kelamin -->
              <div class="mb-3">
                <label class="form-label">Jenis Kelamin</label>
                <select class="form-select" required>
                  <option selected disabled value="">Pilih...</option>
                  <option>Laki-laki</option>
                  <option>Perempuan</option>
                </select>
              </div>

              <!-- Alamat -->
              <div class="mb-3">
                <label for="alamat" class="form-label">Alamat</label>
                <textarea class="form-control" id="alamat" rows="3" placeholder="Masukkan alamat lengkap" required></textarea>
              </div>

              <!-- Tanggal Lahir -->
              <div class="mb-3">
                <label for="tglLahir" class="form-label">Tanggal Lahir</label>
                <input type="date" class="form-control" id="tglLahir" required>
              </div>

              <!-- Upload Foto -->
              <div class="mb-3">
                <label for="foto" class="form-label">Upload Foto</label>
                <input type="file" class="form-control" id="foto" accept="image/*" required>
              </div>

              <!-- Tombol -->
              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Daftar Sekarang</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
              </div>
            </form>
          </div>
        </div>

        <footer>
          <p>© 2025 Formulir Pendaftaran — Dibuat oleh Ajun Arfianto</p>
        </footer>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
