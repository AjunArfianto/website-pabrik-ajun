<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pendaftaran KTP</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- File CSS Eksternal -->
  <link rel="stylesheet" href="src/form.css">
</head>
<body>

  <h2>Formulir Pendaftaran KTP</h2>

  <form id="formKTP">
    <label for="nama">Nama Lengkap</label>
    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda" required>

    <label for="tempatLahir">Tempat Lahir</label>
    <input type="text" id="tempatLahir" name="tempatLahir" placeholder="Masukkan tempat lahir" required>

    <label for="tanggalLahir">Tanggal Lahir</label>
    <input type="date" id="tanggalLahir" name="tanggalLahir" required>

    <label>Jenis Kelamin</label>
    <div class="radio-group">
      <label><input type="radio" name="jenisKelamin" value="Laki-laki" required> Laki-laki</label>
      <label><input type="radio" name="jenisKelamin" value="Perempuan"> Perempuan</label>
    </div>

    <label for="alamat">Alamat</label>
    <input type="text" id="alamat" name="alamat" placeholder="Masukkan alamat lengkap" required>

    <label for="agama">Agama</label>
    <select id="agama" name="agama" required>
      <option value="">Pilih Agama</option>
      <option value="Islam">Islam</option>
      <option value="Kristen">Kristen</option>
      <option value="Katolik">Katolik</option>
      <option value="Hindu">Hindu</option>
      <option value="Buddha">Buddha</option>
      <option value="Konghucu">Konghucu</option>
    </select>

    <label for="status">Status Perkawinan</label>
    <select id="status" name="status" required>
      <option value="">Pilih Status</option>
      <option value="Belum Kawin">Belum Kawin</option>
      <option value="Kawin">Kawin</option>
      <option value="Cerai Hidup">Cerai Hidup</option>
      <option value="Cerai Mati">Cerai Mati</option>
    </select>

    <label for="pekerjaan">Pekerjaan</label>
    <input type="text" id="pekerjaan" name="pekerjaan" placeholder="Masukkan pekerjaan Anda" required>

    <label for="kewarganegaraan">Kewarganegaraan</label>
    <select id="kewarganegaraan" name="kewarganegaraan" required>
      <option value="">Pilih Kewarganegaraan</option>
      <option value="WNI">WNI</option>
      <option value="WNA">WNA</option>
    </select>

    <button type="submit">Kirim</button>
  </form>

  <div id="hasil"></div>

  <script>
    const form = document.getElementById("formKTP");
    const hasil = document.getElementById("hasil");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const nama = document.getElementById("nama").value;
      const tempatLahir = document.getElementById("tempatLahir").value;
      const tanggalLahir = document.getElementById("tanggalLahir").value;
      const jenisKelamin = document.querySelector('input[name="jenisKelamin"]:checked').value;
      const alamat = document.getElementById("alamat").value;
      const agama = document.getElementById("agama").value;
      const status = document.getElementById("status").value;
      const pekerjaan = document.getElementById("pekerjaan").value;
      const kewarganegaraan = document.getElementById("kewarganegaraan").value;

      hasil.innerHTML = `
        <h3>Data Pendaftaran KTP</h3>
        <p><strong>Nama Lengkap:</strong> ${nama}</p>
        <p><strong>Tempat, Tanggal Lahir:</strong> ${tempatLahir}, ${tanggalLahir}</p>
        <p><strong>Jenis Kelamin:</strong> ${jenisKelamin}</p>
        <p><strong>Alamat:</strong> ${alamat}</p>
        <p><strong>Agama:</strong> ${agama}</p>
        <p><strong>Status Perkawinan:</strong> ${status}</p>
        <p><strong>Pekerjaan:</strong> ${pekerjaan}</p>
        <p><strong>Kewarganegaraan:</strong> ${kewarganegaraan}</p>
      `;
    });
  </script>

</body>
</html>
